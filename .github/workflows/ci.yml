      - name: Compute canonical blast-pyramid hash
        shell: bash
        run: |
          set -euo pipefail
          HASH=$(cargo run -p pe-blast --bin blast_hash --release | tr -d '\r\n' | tail -n1)
          echo "Canonical blast hash on ${{ matrix.os }}: $HASH"
          EXPECTED=b51e11e89d4dd055
          if [ "$HASH" != "$EXPECTED" ]; then
