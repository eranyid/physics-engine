name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Determinism: never enable native CPU or FMA in CI.
  RUSTFLAGS: "-C target-cpu=generic"

jobs:
  test:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package with test dependencies
        run: pip install -e ".[test]"

      - name: Run pytest
        run: pytest

  test-slow:
    name: pytest (slow)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package with test dependencies
        run: pip install -e ".[test]"

      - name: Run slow pytest
        run: pytest -m slow

  rust:
    name: cargo test / clippy / fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
          components: rustfmt, clippy

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        # Omit --all-targets so Criterion benches are not executed in default CI.
        # Skip pe-godot in default test (cdylib / no unit tests); build checked separately.
        # Skip pe-examples (bins only; built in the next step).
        run: cargo test --workspace --exclude pe-godot --exclude pe-examples

      - name: cargo build examples
        run: cargo build -p pe-examples --bins

  pe-ffi-c:
    name: pe-ffi C smoke + header drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"

      - name: Install cbindgen
        run: cargo install cbindgen --version 0.28.0 --locked

      - name: Build lib + run C test + header drift
        run: ./crates/pe-ffi/c_tests/run_c_test.sh

  pe-godot-headless:
    name: pe-godot headless suite (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"

      - name: Cache pinned Godot 4.3-stable
        uses: actions/cache@v4
        with:
          path: .godot-ci
          key: godot-4.3-stable-linux-x86_64-fd52bb4b

      - name: Download Godot (verify official SHA-512)
        run: ./godot/ci/download_godot.sh

      - name: Headless suite (drop hash + shapes + joint + raycast + contact)
        run: ./godot/ci/run_headless_suite.sh
        # Required job: Linux headless Godot 4.3-stable loads the GDExtension
        # and runs ci_drop_test + M25 scene tests. Measured: docs/GODOT.md.

  maturin-pytest:
    name: maturin wheel + oracle pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"

      - name: Build abi3 wheel
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release -m python/Cargo.toml --out dist

      - name: Install Python + Rust packages
        run: |
          pip install -e ".[test]"
          pip install dist/*.whl
          python -c "import physics_engine_rs as pe; print(pe.__version__, hex(pe.canonical_determinism_hash()))"

      - name: Pytest (includes oracle; skips slow)
        run: pytest

  determinism-hash:
    name: cross-OS state hash (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"

      # Build-only pe-godot on Windows/macOS (no pinned headless Godot there).
      # Folded into this job to avoid an extra macos-latest runner slot.
      - name: cargo build -p pe-godot (Windows/macOS)
        if: matrix.os != 'ubuntu-latest'
        run: cargo build -p pe-godot

      - name: Compute canonical stage-1 hash
        shell: bash
        run: |
          set -euo pipefail
          HASH=$(cargo run -p pe-core --bin canonical_hash --release | tr -d '\r\n' | tail -n1)
          echo "Canonical stage-1 hash on ${{ matrix.os }}: $HASH"
          EXPECTED=ca172fe3e3e57c79
          if [ "$HASH" != "$EXPECTED" ]; then
            echo "::error::Determinism hash mismatch on ${{ matrix.os }}: got $HASH expected $EXPECTED"
            echo "Do not loosen silently — document OS/toolchain/diff in docs/DETERMINISM.md"
            exit 1
          fi

      - name: Compute canonical stage-2 collision hash
        shell: bash
        run: |
          set -euo pipefail
          HASH=$(cargo run -p pe-collision --bin collision_hash --release | tr -d '\r\n' | tail -n1)
          echo "Canonical collision hash on ${{ matrix.os }}: $HASH"
          EXPECTED=50d52b2193aa528c
          if [ "$HASH" != "$EXPECTED" ]; then
            echo "::error::Collision determinism hash mismatch on ${{ matrix.os }}: got $HASH expected $EXPECTED"
            echo "Do not loosen silently — document OS/toolchain/diff in docs/DETERMINISM.md"
            exit 1
          fi

      - name: Compute canonical scene save/load/continue hashes
        shell: bash
        run: |
          set -euo pipefail
          OUT=$(cargo run -p pe-scene --bin scene_hash --release 2>/dev/null | tr -d '\r')
          HASH=$(echo "$OUT" | sed -n '1p')
          HASH_CONVEX=$(echo "$OUT" | sed -n '2p')
          HASH_GODOT=$(echo "$OUT" | sed -n '3p')
          echo "Canonical scene round-trip hash on ${{ matrix.os }}: $HASH"
          echo "Canonical scene convex round-trip hash on ${{ matrix.os }}: $HASH_CONVEX"
          echo "Godot drop-box hash on ${{ matrix.os }}: $HASH_GODOT"
          EXPECTED=50d52b2193aa528c
          EXPECTED_CONVEX=4ca980096c036ade
          EXPECTED_GODOT=a0d625f02641a420
          if [ "$HASH" != "$EXPECTED" ]; then
            echo "::error::Scene round-trip hash mismatch on ${{ matrix.os }}: got $HASH expected $EXPECTED"
            echo "Do not loosen silently — document OS/toolchain/diff in docs/DETERMINISM.md"
            exit 1
          fi
          if [ "$HASH_CONVEX" != "$EXPECTED_CONVEX" ]; then
            echo "::error::Scene convex round-trip hash mismatch on ${{ matrix.os }}: got $HASH_CONVEX expected $EXPECTED_CONVEX"
            echo "Do not loosen silently — document OS/toolchain/diff in docs/DETERMINISM.md"
            exit 1
          fi
          if [ "$HASH_GODOT" != "$EXPECTED_GODOT" ]; then
            echo "::error::Godot drop hash mismatch on ${{ matrix.os }}: got $HASH_GODOT expected $EXPECTED_GODOT"
            echo "Do not loosen silently — document OS/toolchain/diff in docs/DETERMINISM.md"
            exit 1
          fi

      - name: Compute canonical bake JSON hash
        shell: bash
        run: |
          set -euo pipefail
          HASH=$(cargo run -p pe-scene --bin bake_hash --release 2>/dev/null | tr -d '\r\n' | tail -n1)
          echo "Canonical bake JSON hash on ${{ matrix.os }}: $HASH"
          EXPECTED=3e9a97a85da0cbc6
          if [ "$HASH" != "$EXPECTED" ]; then
            echo "::error::Bake JSON hash mismatch on ${{ matrix.os }}: got $HASH expected $EXPECTED"
            echo "Do not loosen silently — document OS/toolchain/diff in docs/DETERMINISM.md / docs/BAKE.md"
            exit 1
          fi

      - name: Compute canonical M5a soft-step collision hash
        shell: bash
        run: |
          set -euo pipefail
          HASH=$(cargo run -p pe-collision --bin soft_step_hash --release | tr -d '\r\n' | tail -n1)
          echo "Canonical soft-step collision hash on ${{ matrix.os }}: $HASH"
          EXPECTED=676d67a223120e34
          if [ "$HASH" != "$EXPECTED" ]; then
            echo "::error::Soft-step determinism hash mismatch on ${{ matrix.os }}: got $HASH expected $EXPECTED"
            echo "Do not loosen silently — document OS/toolchain/diff in docs/DETERMINISM.md"
            exit 1
          fi

      - name: Compute canonical M5b joints hash
        shell: bash
        run: |
          set -euo pipefail
          HASH=$(cargo run -p pe-collision --bin joints_hash --release | tr -d '\r\n' | tail -n1)
          echo "Canonical joints hash on ${{ matrix.os }}: $HASH"
          EXPECTED=62156ada3fa770ad
          if [ "$HASH" != "$EXPECTED" ]; then
            echo "::error::Joints determinism hash mismatch on ${{ matrix.os }}: got $HASH expected $EXPECTED"
            echo "Do not loosen silently — document OS/toolchain/diff in docs/DETERMINISM.md"
            exit 1
          fi

      - name: Compute canonical M6 convex hash
        shell: bash
        run: |
          set -euo pipefail
          HASH=$(cargo run -p pe-collision --bin convex_hash --release | tr -d '\r\n' | tail -n1)
          echo "Canonical convex hash on ${{ matrix.os }}: $HASH"
          EXPECTED=4ca980096c036ade
          if [ "$HASH" != "$EXPECTED" ]; then
            echo "::error::Convex determinism hash mismatch on ${{ matrix.os }}: got $HASH expected $EXPECTED"
            echo "Do not loosen silently — document OS/toolchain/diff in docs/DETERMINISM.md"
            exit 1
          fi

      - name: Compute canonical stage-3 aero+hydro hash
        shell: bash
        run: |
          set -euo pipefail
          HASH=$(cargo run -p pe-hydro --bin aero_hydro_hash --release | tr -d '\r\n' | tail -n1)
          echo "Canonical aero+hydro hash on ${{ matrix.os }}: $HASH"
          EXPECTED=25ecc6e6a8911d8c
          if [ "$HASH" != "$EXPECTED" ]; then
            echo "::error::Aero/hydro determinism hash mismatch on ${{ matrix.os }}: got $HASH expected $EXPECTED"
            echo "Do not loosen silently — document OS/toolchain/diff in docs/DETERMINISM.md"
            exit 1
          fi

      - name: Compute canonical 6-DOF FDM hashes (body + Dryden + FDM/gust)
        shell: bash
        run: |
          set -euo pipefail
          OUT=$(cargo run -p pe-aero --bin fdm_hash --release | tr -d '\r')
          HASH=$(echo "$OUT" | sed -n '1p')
          GUST=$(echo "$OUT" | sed -n '2p')
          FGUST=$(echo "$OUT" | sed -n '3p')
          echo "Canonical FDM hash on ${{ matrix.os }}: $HASH"
          echo "Canonical Dryden gust hash on ${{ matrix.os }}: $GUST"
          echo "Canonical FDM+held-gust hash on ${{ matrix.os }}: $FGUST"
          EXPECTED=ba6d68e43c69d315
          EXPECTED_GUST=2895b75a14f621c5
          EXPECTED_FGUST=58f491fb7f3b34a6
          if [ "$HASH" != "$EXPECTED" ]; then
            echo "::error::FDM determinism hash mismatch on ${{ matrix.os }}: got $HASH expected $EXPECTED"
            echo "Do not loosen silently — document OS/toolchain/diff in docs/DETERMINISM.md"
            exit 1
          fi
          if [ "$GUST" != "$EXPECTED_GUST" ]; then
            echo "::error::Dryden gust hash mismatch on ${{ matrix.os }}: got $GUST expected $EXPECTED_GUST"
            echo "Do not loosen silently — document OS/toolchain/diff in docs/DETERMINISM.md"
            exit 1
          fi
          if [ "$FGUST" != "$EXPECTED_FGUST" ]; then
            echo "::error::FDM+gust determinism hash mismatch on ${{ matrix.os }}: got $FGUST expected $EXPECTED_FGUST"
            echo "Do not loosen silently — document OS/toolchain/diff in docs/DETERMINISM.md"
            exit 1
          fi

      - name: Compute canonical M7 space hashes (figure-eight + IAS15 + DOP853)
        shell: bash
        run: |
          set -euo pipefail
          OUT=$(cargo run -p pe-space --bin space_hash --release | tr -d '\r')
          HASH8=$(echo "$OUT" | sed -n '1p')
          HASH15=$(echo "$OUT" | sed -n '2p')
          HASHD=$(echo "$OUT" | sed -n '3p')
          echo "Figure-eight hash on ${{ matrix.os }}: $HASH8"
          echo "IAS15 hash on ${{ matrix.os }}: $HASH15"
          echo "DOP853 hash on ${{ matrix.os }}: $HASHD"
          EXPECTED8=4633eb9e6412be18
          EXPECTED15=b918884ca264b70d
          EXPECTEDD=91c17dda5aa7f80e
          if [ "$HASH8" != "$EXPECTED8" ]; then
            echo "::error::Space figure-eight hash mismatch on ${{ matrix.os }}: got $HASH8 expected $EXPECTED8"
            echo "Do not loosen silently — document OS/toolchain/diff in docs/DETERMINISM.md"
            exit 1
          fi
          if [ "$HASH15" != "$EXPECTED15" ]; then
            echo "::error::Space IAS15 hash mismatch on ${{ matrix.os }}: got $HASH15 expected $EXPECTED15"
            echo "Do not loosen silently — document OS/toolchain/diff in docs/DETERMINISM.md"
            exit 1
          fi
          if [ "$HASHD" != "$EXPECTEDD" ]; then
            echo "::error::Space DOP853 hash mismatch on ${{ matrix.os }}: got $HASHD expected $EXPECTEDD"
            echo "Do not loosen silently — document OS/toolchain/diff in docs/DETERMINISM.md"
            exit 1
          fi

      - name: Compute canonical Cummins heave-decay hash
        shell: bash
        run: |
          set -euo pipefail
          HASH=$(cargo run -p pe-hydro --bin cummins_hash --release | tr -d '\r\n' | tail -n1)
          echo "Canonical Cummins hash on ${{ matrix.os }}: $HASH"
          EXPECTED=1ee2f57b9c89c3ae
          if [ "$HASH" != "$EXPECTED" ]; then
            echo "::error::Cummins determinism hash mismatch on ${{ matrix.os }}: got $HASH expected $EXPECTED"
            echo "Do not loosen silently — document OS/toolchain/diff in docs/DETERMINISM.md"
            exit 1
          fi

      - name: Compute canonical 6-DOF Cummins hash (M21)
        shell: bash
        run: |
          set -euo pipefail
          HASH=$(cargo run -p pe-hydro --bin cummins6_hash --release | tr -d '\r\n' | tail -n1)
          echo "Canonical Cummins6 hash on ${{ matrix.os }}: $HASH"
          EXPECTED=b72a60e18efd983d
          if [ "$HASH" != "$EXPECTED" ]; then
            echo "::error::Cummins6 determinism hash mismatch on ${{ matrix.os }}: got $HASH expected $EXPECTED"
            echo "Do not loosen silently — document OS/toolchain/diff in docs/DETERMINISM.md"
            exit 1
          fi

      - name: Compute canonical wave-body hash
        shell: bash
        run: |
          set -euo pipefail
          HASH=$(cargo run -p pe-hydro --bin wave_body_hash --release | tr -d '\r\n' | tail -n1)
          echo "Canonical wave-body hash on ${{ matrix.os }}: $HASH"
          EXPECTED=3f1f6102a4606fbe
          if [ "$HASH" != "$EXPECTED" ]; then
            echo "::error::Wave-body determinism hash mismatch on ${{ matrix.os }}: got $HASH expected $EXPECTED"
            echo "Do not loosen silently — document OS/toolchain/diff in docs/DETERMINISM.md"
            exit 1
          fi

      - name: Compute canonical M11 Morison+BEM hash
        shell: bash
        run: |
          set -euo pipefail
          HASH=$(cargo run -p pe-hydro --bin m11_hash --release | tr -d '\r\n' | tail -n1)
          echo "Canonical M11 hash on ${{ matrix.os }}: $HASH"
          EXPECTED=83aebe96f5cb8e4c
          if [ "$HASH" != "$EXPECTED" ]; then
            echo "::error::M11 determinism hash mismatch on ${{ matrix.os }}: got $HASH expected $EXPECTED"
            echo "Do not loosen silently — document OS/toolchain/diff in docs/DETERMINISM.md"
            exit 1
          fi

      - name: Compute canonical blast hashes (pyramid + M20)
        shell: bash
        run: |
          set -euo pipefail
          OUT=$(cargo run -p pe-blast --bin blast_hash --release | tr -d '\r')
          HASH_PYRAMID=$(printf '%s\n' "$OUT" | sed -n '1p')
          HASH_EXTERNAL=$(printf '%s\n' "$OUT" | sed -n '2p')
          HASH_FRAGMENTS=$(printf '%s\n' "$OUT" | sed -n '3p')
          HASH_DESTRUCTION=$(printf '%s\n' "$OUT" | sed -n '4p')
          echo "Canonical blast hashes on ${{ matrix.os }}: $HASH_PYRAMID $HASH_EXTERNAL $HASH_FRAGMENTS $HASH_DESTRUCTION"
          EXPECTED_PYRAMID=b51e11e89d4dd055
          EXPECTED_EXTERNAL=693b60be33f9b8f2
          EXPECTED_FRAGMENTS=36d3f61d77c14859
          EXPECTED_DESTRUCTION=38f55bac9ab3d16f
          if [ -z "$HASH_DESTRUCTION" ]; then
            echo "::error::Blast hash binary expected 4 lines"
            exit 1
          fi
          if [ "$HASH_PYRAMID" != "$EXPECTED_PYRAMID" ]; then
            echo "::error::Blast pyramid hash mismatch on ${{ matrix.os }}: got $HASH_PYRAMID expected $EXPECTED_PYRAMID"
            echo "Do not loosen silently — document OS/toolchain/diff in docs/DETERMINISM.md"
            exit 1
          fi
          if [ "$HASH_EXTERNAL" != "$EXPECTED_EXTERNAL" ]; then
            echo "::error::Blast ExternalLoads hash mismatch on ${{ matrix.os }}: got $HASH_EXTERNAL expected $EXPECTED_EXTERNAL"
            exit 1
          fi
          if [ "$HASH_FRAGMENTS" != "$EXPECTED_FRAGMENTS" ]; then
            echo "::error::Blast fragments hash mismatch on ${{ matrix.os }}: got $HASH_FRAGMENTS expected $EXPECTED_FRAGMENTS"
            exit 1
          fi
          if [ "$HASH_DESTRUCTION" != "$EXPECTED_DESTRUCTION" ]; then
            echo "::error::Blast destruction hash mismatch on ${{ matrix.os }}: got $HASH_DESTRUCTION expected $EXPECTED_DESTRUCTION"
            exit 1
          fi

      - name: Compute canonical ballistics volley hash
        shell: bash
        run: |
          set -euo pipefail
          HASH=$(cargo run -p pe-ballistics --bin ballistics_hash --release | tr -d '\r\n' | tail -n1)
          echo "Canonical ballistics hash on ${{ matrix.os }}: $HASH"
          # Locked value follows pe-aero Dryden (2nd-order v/w); was a9ec62a39bbd3dc4.
          EXPECTED=7b0162d346bf9f1b
          if [ "$HASH" != "$EXPECTED" ]; then
            echo "::error::Ballistics determinism hash mismatch on ${{ matrix.os }}: got $HASH expected $EXPECTED"
            echo "Do not loosen silently — document OS/toolchain/diff in docs/DETERMINISM.md"
            exit 1
          fi

      - name: Compute canonical M8 soft-body hash
        shell: bash
        run: |
          set -euo pipefail
          HASH=$(cargo run -p pe-soft --bin soft_hash --release | tr -d '\r\n' | tail -n1)
          echo "Canonical soft-body hash on ${{ matrix.os }}: $HASH"
          EXPECTED=adfc0a4c1209e5dc
          if [ "$HASH" != "$EXPECTED" ]; then
            echo "::error::Soft-body determinism hash mismatch on ${{ matrix.os }}: got $HASH expected $EXPECTED"
            echo "Do not loosen silently — document OS/toolchain/diff in docs/DETERMINISM.md"
            exit 1
          fi

      - name: Compute canonical materials-track hash
        shell: bash
        run: |
          set -euo pipefail
          HASH=$(cargo run -p pe-soft --bin materials_hash --release | tr -d '\r\n' | tail -n1)
          echo "Canonical materials hash on ${{ matrix.os }}: $HASH"
          EXPECTED=19498ab91f6febdc
          if [ "$HASH" != "$EXPECTED" ]; then
            echo "::error::Materials determinism hash mismatch on ${{ matrix.os }}: got $HASH expected $EXPECTED"
            echo "Do not loosen silently — document OS/toolchain/diff in docs/DETERMINISM.md"
            exit 1
          fi

      - name: Compute canonical soft↔rigid coupling hash
        shell: bash
        run: |
          set -euo pipefail
          HASH=$(cargo run -p pe-soft --bin soft_coupling_hash --release | tr -d '\r\n' | tail -n1)
          echo "Canonical soft↔rigid coupling hash on ${{ matrix.os }}: $HASH"
          EXPECTED=3dfd4cf670923310
          if [ "$HASH" != "$EXPECTED" ]; then
            echo "::error::Soft↔rigid coupling determinism hash mismatch on ${{ matrix.os }}: got $HASH expected $EXPECTED"
            echo "Do not loosen silently — document OS/toolchain/diff in docs/DETERMINISM.md"
            exit 1
          fi

      - name: Compute canonical fluid-tank hash
        shell: bash
        run: |
          set -euo pipefail
          HASH=$(cargo run -p pe-fluid --bin fluid_hash --release | tr -d '\r\n' | tail -n1)
          echo "Canonical fluid hash on ${{ matrix.os }}: $HASH"
          EXPECTED=9d9e0da856fd43d4
          if [ "$HASH" != "$EXPECTED" ]; then
            echo "::error::Fluid determinism hash mismatch on ${{ matrix.os }}: got $HASH expected $EXPECTED"
            echo "Do not loosen silently — document OS/toolchain/diff in docs/DETERMINISM.md"
            exit 1
          fi

      - name: Compute canonical DFSPH-tank hash
        shell: bash
        run: |
          set -euo pipefail
          HASH=$(cargo run -p pe-fluid --bin dfsph_hash --release | tr -d '\r\n' | tail -n1)
          echo "Canonical DFSPH hash on ${{ matrix.os }}: $HASH"
          EXPECTED=f1f2825b5eeaab0d
          if [ "$HASH" != "$EXPECTED" ]; then
            echo "::error::DFSPH determinism hash mismatch on ${{ matrix.os }}: got $HASH expected $EXPECTED"
            echo "Do not loosen silently — document OS/toolchain/diff in docs/DETERMINISM.md"
            exit 1
          fi

      - name: Compute canonical fluid↔rigid coupling hash
        shell: bash
        run: |
          set -euo pipefail
          HASH=$(cargo run -p pe-fluid --bin coupling_hash --release | tr -d '\r\n' | tail -n1)
          echo "Canonical coupling hash on ${{ matrix.os }}: $HASH"
          EXPECTED=e9a6a84fef4ce9d5
          if [ "$HASH" != "$EXPECTED" ]; then
            echo "::error::Coupling determinism hash mismatch on ${{ matrix.os }}: got $HASH expected $EXPECTED"
            echo "Do not loosen silently — document OS/toolchain/diff in docs/DETERMINISM.md"
            exit 1
          fi

  # M22 long-run stability + larger proptest profile (opt-in / weekly).
  rust-stability:
    name: rust stability + proptest (slow)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    env:
      PROPTEST_CASES: "256"
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"

      - name: Larger property suites
        run: |
          set -euo pipefail
          cargo test -p pe-core --test properties --release
          cargo test -p pe-collision --test properties --release
          cargo test -p pe-scene --test roundtrip --release
          cargo test -p pe-ffi --test boundary --release

      - name: Long-run stability (ignored)
        run: |
          set -euo pipefail
          cargo test -p pe-collision --test stability --release -- --ignored --nocapture
          cargo test -p pe-space --test stability --release -- --ignored --nocapture
          cargo test -p pe-aero --test stability --release -- --ignored --nocapture

  # Hash-only smoke for the rigid-body pipeline. Never asserts on wall time
  # (timing flakes); locked hashes and parallel island bit-identity only.
  perf-smoke:
    name: rigid-body perf smoke (hashes only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"

      - name: Locked collision / soft / joints / convex hashes
        run: |
          set -euo pipefail
          cargo test -p pe-collision --test perf_determinism --release -- --nocapture

      - name: Parallel island hashes identical at 1/2/8 threads
        run: |
          set -euo pipefail
          cargo test -p pe-collision --test perf_determinism --release --features parallel -- --nocapture

  # M26: fast wall-clock microbench vs committed baseline. Fail on large
  # regressions only (default margin 100% / 2×). See docs/PERFORMANCE.md.
  perf-bench:
    name: ci_bench vs baseline (2× margin)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run ci_bench (release, generic CPU)
        run: |
          set -euo pipefail
          cargo run -p pe-examples --bin ci_bench --release > /tmp/ci_bench.json
          cat /tmp/ci_bench.json

      - name: Compare to docs/baselines/ci_bench.json
        run: |
          set -euo pipefail
          python3 scripts/check_ci_bench.py --measured /tmp/ci_bench.json --margin 1.0
