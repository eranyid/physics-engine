      - name: Compute canonical materials-track hash
        shell: bash
        run: |
          set -euo pipefail
          HASH=$(cargo run -p pe-soft --bin materials_hash --release | tr -d '\r\n' | tail -n1)
          echo "Canonical materials hash on ${{ matrix.os }}: $HASH"
