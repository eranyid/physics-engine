name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Determinism: never enable native CPU or FMA in CI.
  RUSTFLAGS: "-C target-cpu=generic"

jobs:
  test:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package with test dependencies
        run: pip install -e ".[test]"

      - name: Run pytest
        run: pytest

  test-slow:
    name: pytest (slow)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package with test dependencies
        run: pip install -e ".[test]"

      - name: Run slow pytest
        run: pytest -m slow

  rust:
    name: cargo test / clippy / fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
          components: rustfmt, clippy

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        # Omit --all-targets so Criterion benches are not executed in default CI.
        # Skip pe-godot in default test (cdylib / no unit tests); build checked separately.
        run: cargo test --workspace --exclude pe-godot

  pe-ffi-c:
    name: pe-ffi C smoke + header drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"

      - name: Install cbindgen
        run: cargo install cbindgen --version 0.28.0 --locked

      - name: Build lib + run C test + header drift
        run: ./crates/pe-ffi/c_tests/run_c_test.sh

  pe-godot-headless:
    name: pe-godot headless drop test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"

      - name: Cache pinned Godot 4.3-stable
        uses: actions/cache@v4
        with:
          path: .godot-ci
          key: godot-4.3-stable-linux-x86_64-fd52bb4b

      - name: Download Godot (verify official SHA-512)
        run: ./godot/ci/download_godot.sh

      - name: Headless drop test (y tolerance + state hash)
        run: ./godot/ci/run_headless_drop.sh
        # Required job: Linux headless Godot 4.3-stable actually loads the
        # GDExtension and runs ci_drop_test.tscn. Measured results: docs/GODOT.md.

  maturin-pytest:
    name: maturin wheel + oracle pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"

      - name: Build abi3 wheel
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release -m python/Cargo.toml --out dist

      - name: Install Python + Rust packages
        run: |
          pip install -e ".[test]"
          pip install dist/*.whl
          python -c "import physics_engine_rs as pe; print(pe.__version__, hex(pe.canonical_determinism_hash()))"

      - name: Pytest (includes oracle; skips slow)
        run: pytest

  determinism-hash:
    name: cross-OS state hash (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"

      - name: Compute canonical stage-1 hash
        shell: bash
        run: |
          set -euo pipefail
          HASH=$(cargo run -p pe-core --bin canonical_hash --release | tr -d '\r\n' | tail -n1)
          echo "Canonical stage-1 hash on ${{ matrix.os }}: $HASH"
          EXPECTED=ca172fe3e3e57c79
          if [ "$HASH" != "$EXPECTED" ]; then
            echo "::error::Determinism hash mismatch on ${{ matrix.os }}: got $HASH expected $EXPECTED"
            echo "Do not loosen silently — document OS/toolchain/diff in docs/DETERMINISM.md"
            exit 1
          fi

      - name: Compute canonical stage-2 collision hash
        shell: bash
        run: |
          set -euo pipefail
          HASH=$(cargo run -p pe-collision --bin collision_hash --release | tr -d '\r\n' | tail -n1)
          echo "Canonical collision hash on ${{ matrix.os }}: $HASH"
          EXPECTED=50d52b2193aa528c
          if [ "$HASH" != "$EXPECTED" ]; then
            echo "::error::Collision determinism hash mismatch on ${{ matrix.os }}: got $HASH expected $EXPECTED"
            echo "Do not loosen silently — document OS/toolchain/diff in docs/DETERMINISM.md"
            exit 1
          fi

      - name: Compute canonical scene save/load/continue hashes
        shell: bash
        run: |
          set -euo pipefail
          OUT=$(cargo run -p pe-scene --bin scene_hash --release 2>/dev/null | tr -d '\r')
          HASH=$(echo "$OUT" | sed -n '1p')
          HASH_CONVEX=$(echo "$OUT" | sed -n '2p')
          HASH_GODOT=$(echo "$OUT" | sed -n '3p')
          echo "Canonical scene round-trip hash on ${{ matrix.os }}: $HASH"
          echo "Canonical scene convex round-trip hash on ${{ matrix.os }}: $HASH_CONVEX"
          echo "Godot drop-box hash on ${{ matrix.os }}: $HASH_GODOT"
          EXPECTED=50d52b2193aa528c
          EXPECTED_CONVEX=4ca980096c036ade
          EXPECTED_GODOT=a0d625f02641a420
          if [ "$HASH" != "$EXPECTED" ]; then
            echo "::error::Scene round-trip hash mismatch on ${{ matrix.os }}: got $HASH expected $EXPECTED"
            echo "Do not loosen silently — document OS/toolchain/diff in docs/DETERMINISM.md"
            exit 1
          fi
          if [ "$HASH_CONVEX" != "$EXPECTED_CONVEX" ]; then
            echo "::error::Scene convex round-trip hash mismatch on ${{ matrix.os }}: got $HASH_CONVEX expected $EXPECTED_CONVEX"
            echo "Do not loosen silently — document OS/toolchain/diff in docs/DETERMINISM.md"
            exit 1
          fi
          if [ "$HASH_GODOT" != "$EXPECTED_GODOT" ]; then
            echo "::error::Godot drop hash mismatch on ${{ matrix.os }}: got $HASH_GODOT expected $EXPECTED_GODOT"
            echo "Do not loosen silently — document OS/toolchain/diff in docs/DETERMINISM.md"
            exit 1
          fi

      - name: Compute canonical M5a soft-step collision hash
        shell: bash
        run: |
          set -euo pipefail
          HASH=$(cargo run -p pe-collision --bin soft_step_hash --release | tr -d '\r\n' | tail -n1)
          echo "Canonical soft-step collision hash on ${{ matrix.os }}: $HASH"
          EXPECTED=676d67a223120e34
          if [ "$HASH" != "$EXPECTED" ]; then
            echo "::error::Soft-step determinism hash mismatch on ${{ matrix.os }}: got $HASH expected $EXPECTED"
            echo "Do not loosen silently — document OS/toolchain/diff in docs/DETERMINISM.md"
            exit 1
          fi

      - name: Compute canonical M5b joints hash
        shell: bash
        run: |
          set -euo pipefail
          HASH=$(cargo run -p pe-collision --bin joints_hash --release | tr -d '\r\n' | tail -n1)
          echo "Canonical joints hash on ${{ matrix.os }}: $HASH"
          EXPECTED=62156ada3fa770ad
          if [ "$HASH" != "$EXPECTED" ]; then
            echo "::error::Joints determinism hash mismatch on ${{ matrix.os }}: got $HASH expected $EXPECTED"
            echo "Do not loosen silently — document OS/toolchain/diff in docs/DETERMINISM.md"
            exit 1
          fi

      - name: Compute canonical M6 convex hash
        shell: bash
        run: |
          set -euo pipefail
          HASH=$(cargo run -p pe-collision --bin convex_hash --release | tr -d '\r\n' | tail -n1)
          echo "Canonical convex hash on ${{ matrix.os }}: $HASH"
          EXPECTED=4ca980096c036ade
          if [ "$HASH" != "$EXPECTED" ]; then
            echo "::error::Convex determinism hash mismatch on ${{ matrix.os }}: got $HASH expected $EXPECTED"
            echo "Do not loosen silently — document OS/toolchain/diff in docs/DETERMINISM.md"
            exit 1
          fi

      - name: Compute canonical stage-3 aero+hydro hash
        shell: bash
        run: |
          set -euo pipefail
          HASH=$(cargo run -p pe-hydro --bin aero_hydro_hash --release | tr -d '\r\n' | tail -n1)
          echo "Canonical aero+hydro hash on ${{ matrix.os }}: $HASH"
          EXPECTED=25ecc6e6a8911d8c
          if [ "$HASH" != "$EXPECTED" ]; then
            echo "::error::Aero/hydro determinism hash mismatch on ${{ matrix.os }}: got $HASH expected $EXPECTED"
            echo "Do not loosen silently — document OS/toolchain/diff in docs/DETERMINISM.md"
            exit 1
          fi

      - name: Compute canonical M7 space hashes (figure-eight + IAS15 + DOP853)
        shell: bash
        run: |
          set -euo pipefail
          OUT=$(cargo run -p pe-space --bin space_hash --release | tr -d '\r')
          HASH8=$(echo "$OUT" | sed -n '1p')
          HASH15=$(echo "$OUT" | sed -n '2p')
          HASHD=$(echo "$OUT" | sed -n '3p')
          echo "Figure-eight hash on ${{ matrix.os }}: $HASH8"
          echo "IAS15 hash on ${{ matrix.os }}: $HASH15"
          echo "DOP853 hash on ${{ matrix.os }}: $HASHD"
          EXPECTED8=4633eb9e6412be18
          EXPECTED15=b918884ca264b70d
          EXPECTEDD=91c17dda5aa7f80e
          if [ "$HASH8" != "$EXPECTED8" ]; then
            echo "::error::Space figure-eight hash mismatch on ${{ matrix.os }}: got $HASH8 expected $EXPECTED8"
            echo "Do not loosen silently — document OS/toolchain/diff in docs/DETERMINISM.md"
            exit 1
          fi
          if [ "$HASH15" != "$EXPECTED15" ]; then
            echo "::error::Space IAS15 hash mismatch on ${{ matrix.os }}: got $HASH15 expected $EXPECTED15"
            echo "Do not loosen silently — document OS/toolchain/diff in docs/DETERMINISM.md"
            exit 1
          fi
          if [ "$HASHD" != "$EXPECTEDD" ]; then
            echo "::error::Space DOP853 hash mismatch on ${{ matrix.os }}: got $HASHD expected $EXPECTEDD"
            echo "Do not loosen silently — document OS/toolchain/diff in docs/DETERMINISM.md"
            exit 1
          fi

      - name: Compute canonical Cummins heave-decay hash
        shell: bash
        run: |
          set -euo pipefail
          HASH=$(cargo run -p pe-hydro --bin cummins_hash --release | tr -d '\r\n' | tail -n1)
          echo "Canonical Cummins hash on ${{ matrix.os }}: $HASH"
          EXPECTED=1ee2f57b9c89c3ae
          if [ "$HASH" != "$EXPECTED" ]; then
            echo "::error::Cummins determinism hash mismatch on ${{ matrix.os }}: got $HASH expected $EXPECTED"
            echo "Do not loosen silently — document OS/toolchain/diff in docs/DETERMINISM.md"
            exit 1
          fi

      - name: Compute canonical wave-body hash
        shell: bash
        run: |
          set -euo pipefail
