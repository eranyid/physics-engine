[workspace]
resolver = "2"
members = [
    "crates/pe-math",
    "crates/pe-core",
    "crates/pe-collision",
    "crates/pe-aero",
    "crates/pe-hydro",
    "crates/pe-space",
    "crates/pe-blast",
    "crates/pe-ballistics",
    "crates/pe-soft",
    "python",
]
default-members = [
    "crates/pe-math",
    "crates/pe-core",
    "crates/pe-collision",
    "crates/pe-aero",
    "crates/pe-hydro",
    "crates/pe-space",
    "crates/pe-blast",
    "crates/pe-ballistics",
    "crates/pe-soft",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/eranyid/physics-engine"
rust-version = "1.85"

[workspace.dependencies]
pe-math = { path = "crates/pe-math" }
pe-core = { path = "crates/pe-core" }
pe-collision = { path = "crates/pe-collision" }
pe-aero = { path = "crates/pe-aero" }
pe-hydro = { path = "crates/pe-hydro" }
pe-space = { path = "crates/pe-space" }
pe-blast = { path = "crates/pe-blast" }
pe-ballistics = { path = "crates/pe-ballistics" }
pe-soft = { path = "crates/pe-soft" }
libm = "0.2"
approx = "0.5"
proptest = "1.5"
criterion = { version = "0.5", features = ["html_reports"] }
numpy = "0.23"
# abi3: build once, run on CPython 3.10+
pyo3 = { version = "0.23", features = ["extension-module", "abi3-py310"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
