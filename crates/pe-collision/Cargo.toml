[package]
name = "pe-collision"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Shapes, broad/narrow phase, contact manifolds, sequential-impulse solver (stage 2)"

[features]
default = []
# Deterministic island parallelism (rayon). Off by default so CI stays single-thread.
# Island-ordered sequential and parallel paths are bit-identical across thread counts;
# they are *not* required to match the global-PGS oracle hash (locked hashes use default).
parallel = ["dep:rayon"]

[dependencies]
pe-math = { workspace = true }
pe-core = { workspace = true }
rayon = { version = "1.10", optional = true }

[dev-dependencies]
approx = { workspace = true }
proptest = { workspace = true }
criterion = { workspace = true }
rayon = "1.10"

[[bench]]
name = "contact_pyramids"
harness = false

[[bench]]
name = "scaling"
harness = false
