[package]
name = "pe-blast"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Engineering blast / shock models: Hopkinson–Cranz, Kinney–Graham, Friedlander, Sedov–Taylor, 1-D / 3-D Euler, Gurney/Mott"

[features]
# Deterministic rayon parallelism for the 3-D Euler solver (bit-identical to serial).
parallel = ["dep:rayon"]

[dependencies]
pe-math = { workspace = true }
pe-core = { workspace = true }
rayon = { version = "1.10", optional = true }

[dev-dependencies]
approx = { workspace = true }
proptest = { workspace = true }
criterion = { workspace = true }

[[bench]]
name = "blast"
harness = false

[[bin]]
name = "blast_hash"
path = "src/bin/blast_hash.rs"

[[bin]]
name = "blast3d_hash"
path = "src/bin/blast3d_hash.rs"
