[package]
name = "pe-fluid"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Particle fluids: SPH (WCSPH), PBF, and DFSPH, 3D with 2D test mode"

[dependencies]
pe-math = { workspace = true }
pe-core = { workspace = true }

[dev-dependencies]
approx = { workspace = true }
proptest = { workspace = true }
criterion = { workspace = true }

[[bench]]
name = "fluid"
harness = false

[[bin]]
name = "fluid_hash"
path = "src/bin/fluid_hash.rs"

[[bin]]
name = "dfsph_hash"
path = "src/bin/dfsph_hash.rs"

[[bin]]
name = "coupling_hash"
path = "src/bin/coupling_hash.rs"
